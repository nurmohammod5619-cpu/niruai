<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#09090d">
<title>Niru AI</title>
<style>
:root{--bg:#08080c;--panel:#111118;--panel2:#171720;--line:#292934;--text:#f7f7fb;--muted:#9b9ba9;--pink:#ff2690;--purple:#9857ff;--good:#46d89a;--danger:#ff5575;--g:linear-gradient(135deg,var(--pink),var(--purple))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050507;color:var(--text);font-family:Inter,"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none}[hidden]{display:none!important}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{position:fixed;inset:0;height:100dvh;width:min(100%,620px);margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:621px){.wrap{border:solid var(--line);border-width:0 1px}}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}.ib:active{background:var(--panel2)}
.logo{font-weight:900;letter-spacing:-.6px}.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark{display:grid;place-items:center;border-radius:50%;background:var(--g);font-weight:900;flex:none}
/* login */
#login{padding:calc(env(safe-area-inset-top) + 24px) 22px 24px;justify-content:center;overflow:auto}
#login .mark{width:72px;height:72px;font-size:32px;margin:0 auto 14px;box-shadow:0 10px 40px rgba(255,38,144,.3)}
#login h1{text-align:center;font-size:30px;margin:0}#login p{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px}
.tab{flex:1;color:#8f8f9d;padding:11px;border-bottom:2px solid transparent;font-size:13px;font-weight:750}.tab.on{color:#fff;border-color:var(--pink)}
.field{margin:10px 0}.field label{font-size:11px;color:#aaaab6;display:block;margin-bottom:6px}
.field input{width:100%;background:#0b0b10;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.field input:focus{border-color:rgba(255,38,144,.55)}
.btn{background:var(--g);padding:13px 14px;border-radius:12px;font-weight:800;font-size:14px;width:100%;margin-top:8px}
.msgerr{color:#ff7f98;font-size:12px;min-height:16px;margin-top:6px}
/* top */
.top{height:60px;flex:none;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 10px 4px;background:rgba(13,13,20,.97);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;text-align:center;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 13px 22px;display:flex;flex-direction:column;gap:10px}
.hello{margin:auto;text-align:center}.hello .mark{width:64px;height:64px;font-size:28px;margin:0 auto 14px}.hello h2{margin:0;font-size:24px}.hello p{color:var(--muted);margin:6px 0 0;font-size:14px}
.bubble{max-width:88%;min-width:0;padding:11px 13px;border-radius:17px;background:#1b1b25;border:1px solid #2c2c38;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:linear-gradient(135deg,#9c2870,#6335a0);border-color:transparent;border-bottom-right-radius:5px;white-space:pre-wrap}
.theirs{align-self:flex-start;border-bottom-left-radius:5px}.bubble:has(.code){width:min(100%,92%)}
.time{font-size:10px;color:#c6c2ce;display:block;text-align:right;margin-top:5px}.theirs .time{color:#777783}
.md p{margin:0 0 8px}.md p:last-child{margin:0}.md h4{margin:10px 0 6px;font-size:15px}.md ul,.md ol{margin:4px 0 8px;padding-left:20px}
.md code{background:#0b0b10;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#ff9ccd}
.code{margin:8px 0;background:#0b0b10;border:1px solid var(--line);border-radius:12px;overflow:hidden}.code:first-child{margin-top:0}
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.copy{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:750;color:#c9c9d4}.copy.done{color:var(--good)}
.code pre{margin:0;padding:12px;overflow-x:auto}.code pre code{display:block;background:none;border:0;padding:0;color:#e6e6ef;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.t-c{color:#6f7a8c;font-style:italic}.t-s{color:#7ee2a8}.t-n{color:#ffb86b}.t-k{color:#ff75b7}.t-f{color:#a98bff}
.typing{display:flex;gap:4px;padding:4px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.typing i{animation:none}}
.err{align-self:center;max-width:90%;text-align:center;font-size:12px;color:#ff7f98;background:rgba(255,85,117,.13);border:1px solid rgba(255,85,117,.3);padding:9px 12px;border-radius:12px}
/* page */
#page{flex:1;overflow-y:auto;padding:16px 14px}#page h2{margin:0 0 12px;font-size:20px}.empty{color:var(--muted);text-align:center;margin-top:60px;font-size:13px;line-height:1.6}
/* compose */
.compose{flex:none;display:flex;align-items:flex-end;gap:6px;margin:8px 10px calc(env(safe-area-inset-bottom) + 10px);padding:6px;background:#1a1a24;border:1px solid #333340;border-radius:26px}
.compose:focus-within{border-color:rgba(255,38,144,.55)}
.compose textarea{flex:1;min-height:42px;max-height:110px;resize:none;background:none;border:0;outline:0;padding:11px 4px;line-height:1.35}
.compose .ib{border-radius:50%;background:var(--panel2);width:42px;height:42px}.compose .on{color:var(--pink)}
#send{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
/* drawer + sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:40;opacity:0;pointer-events:none;transition:.22s}.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(84%,340px);z-index:50;background:#0d0d14;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 12px calc(env(safe-area-inset-bottom) + 14px)}
.drawer.show{transform:none}
.drawer .logo{font-size:26px;padding:0 8px 14px}
.nv{display:flex;align-items:center;gap:14px;padding:13px 10px;border-radius:13px;font-size:15px;font-weight:650;width:100%;text-align:left}.nv.on{background:var(--panel2)}.nv svg{color:var(--pink)}
.rt{font-size:12px;color:var(--muted);padding:14px 10px 6px;border-top:1px solid var(--line);margin-top:8px}
.rec{flex:1;overflow-y:auto}.ri{display:flex;align-items:center;border-radius:12px}.ri.on{background:var(--panel2)}
.ri .o{flex:1;min-width:0;text-align:left;padding:11px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .x{color:#777783;width:34px;height:34px;display:grid;place-items:center}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px}.foot .mark{width:44px;height:44px;font-size:15px}
.nc{background:var(--g);padding:13px 20px;border-radius:999px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet-bg{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:flex-end}.sheet-bg.show{display:flex}
.sheet{width:100%;background:#101017;border:1px solid var(--line);border-radius:23px 23px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sh{display:flex;align-items:center;margin-bottom:12px;font-size:17px;font-weight:850}.sh span{flex:1;text-align:center}.sh .ib{background:var(--panel2)}
.mo{display:flex;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:8px}
.mo.on{border-color:rgba(255,38,144,.55);background:rgba(255,38,144,.08)}.mo div{flex:1}.mo b{display:block;font-size:15px}.mo small{color:var(--muted);font-size:12px}.mo svg{color:var(--pink)}
.eff{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:4px;font-weight:750}
.eff em{font-style:normal;color:var(--muted);font-weight:600;font-size:13px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#24242d;border:1px solid #3b3b47;padding:10px 14px;border-radius:13px;font-size:12px;z-index:90;display:none}
</style>
<style id="niru-liquid-glass">
/* ===== Liquid Glass skin (like NexChat): blur only on small bars/sheets, cheap frosted gradients elsewhere ===== */
html{background:#07070d}
*{-webkit-tap-highlight-color:transparent}
body{background:transparent!important;
  --g-bg:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 50%,rgba(255,255,255,.09));
  --g-line:rgba(255,255,255,.17);--g-blur:blur(16px) saturate(150%);
  --g-edge:inset 0 1px 0 rgba(255,255,255,.32),0 6px 16px rgba(0,0,0,.24);
  --ease:cubic-bezier(.2,.8,.25,1)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--pink) 55%,transparent),transparent 36%),
   radial-gradient(circle at 90% 26%,color-mix(in srgb,var(--purple) 55%,transparent),transparent 38%),
   radial-gradient(circle at 25% 90%,rgba(56,140,255,.34),transparent 40%),
   radial-gradient(circle at 80% 88%,color-mix(in srgb,var(--pink) 34%,transparent),transparent 34%)}
body .wrap{background:transparent}
/* frosted (no blur) */
body :is(.bubble.theirs,.mo,.eff,.copy,.btn.sec,.field input){background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge)}
body .field input{background:rgba(255,255,255,.08);box-shadow:none}
body .code{background:rgba(8,8,14,.55);border-color:var(--g-line)}
body .ch{background:rgba(255,255,255,.07);border-color:var(--g-line)}
body .md code{background:rgba(8,8,14,.5)}
body .mine{background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 72%,transparent),color-mix(in srgb,var(--purple) 72%,transparent));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
body .mo.on{background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 40%,transparent),color-mix(in srgb,var(--purple) 24%,transparent));border-color:rgba(255,255,255,.3)}
body .btn,body .nc,body #send{border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px color-mix(in srgb,var(--pink) 28%,transparent)}
/* real blur: small always-visible bars only */
body :is(.top,.compose,.toast){background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
body .top{border-width:0 0 1px;border-radius:0}
body .compose{margin:8px 10px calc(env(safe-area-inset-bottom) + 10px);border-radius:30px;box-shadow:var(--g-edge),0 14px 30px rgba(0,0,0,.34)}
body .compose .ib{background:rgba(255,255,255,.1)}
body .drawer{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(14,12,26,.86);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);border-right:1px solid var(--g-line);box-shadow:inset -1px 0 0 rgba(255,255,255,.14),20px 0 40px rgba(0,0,0,.35)}
body .sheet{border-radius:28px 28px 0 0;border:1px solid var(--g-line);border-bottom:0;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(18,16,30,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
body .toast{border-radius:999px;padding:11px 18px}
body .rt{border-color:var(--g-line)}
body .ri.on{background:var(--g-bg)}
body .tabs{border-color:var(--g-line)}
body .hello .mark{box-shadow:0 10px 40px color-mix(in srgb,var(--pink) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
/* sliding glass indicator: transform only */
.navs{position:relative}.navs .nv{position:relative;z-index:1}
body .nv.on{background:none}
.nav-glass{position:absolute;left:0;right:0;top:0;height:0;border-radius:13px;pointer-events:none;z-index:0;opacity:0;will-change:transform;
  background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--pink) 30%,transparent);
  transition:transform .42s cubic-bezier(.3,1.25,.5,1),height .2s,opacity .2s}
.nav-glass.on{opacity:1}
/* smooth motion */
.drawer{transition:transform .36s var(--ease);will-change:transform}.scrim{transition:opacity .3s}
button{transition:transform .15s,background .18s,border-color .18s}
:is(.ib,.nc,.mo,.eff,.nv,.chip,.copy,.btn,#send,.ri .o):active{transform:scale(.95)}
.bubble,.err{animation:pop .26s var(--ease) backwards}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.lg-enter{animation:lgPage .3s var(--ease) backwards}
@keyframes lgPage{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.sheet-bg.show{animation:fade .22s ease}.sheet-bg.show .sheet{animation:up .36s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation:pop .22s var(--ease)}
.msgs,#page,.rec{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="niru-glass-2">
/* Login: top-aligned so switching tabs never moves the logo; glass card; sliding tab indicator */
body #login{justify-content:flex-start;padding:calc(env(safe-area-inset-top) + clamp(20px,8vh,72px)) 18px 28px}
.lhead,.gcard{position:relative;z-index:1}
.lhead{margin-bottom:6px}
.orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.o1{width:240px;height:240px;left:-70px;top:30%;background:radial-gradient(circle at 40% 40%,var(--pink),transparent 70%);opacity:.9}
.o2{width:280px;height:280px;right:-90px;bottom:6%;background:radial-gradient(circle at 60% 40%,var(--purple),transparent 70%);opacity:.95}
.gcard{padding:16px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 55%,rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 18px 44px rgba(0,0,0,.38);-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%)}
.gcard .field label{color:#dcdce8}
.gcard .field input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:border-color .2s,background .2s}
.gcard .field input:focus{background:rgba(255,255,255,.15)}
body .tabs{position:relative;display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:4px;margin-bottom:6px}
body .tab,body .tab.on{border:0;border-radius:12px;position:relative;z-index:1;background:none;transition:color .25s}
body .tab.on{color:#fff}
.tab-glass{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;pointer-events:none;z-index:0;will-change:transform;background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--pink) 30%,transparent);transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
.collapse{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .36s var(--ease),opacity .28s}
.collapse.open{grid-template-rows:1fr;opacity:1}.collapse>div{overflow:hidden;min-height:0}
.swap{animation:swap .28s var(--ease)}@keyframes swap{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
/* smooth moves between screens */
.app-in{animation:appIn .5s var(--ease) backwards}
@keyframes appIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.ttl-in{animation:fade .28s ease}
.hello{animation:pop .45s var(--ease) backwards}
.static .bubble{animation:none}
.sheet-bg.out{animation:fadeOut .21s ease forwards}.sheet-bg.out .sheet{animation:down .22s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}}@keyframes down{to{transform:translateY(70px);opacity:.3}}
</style>
<style id="niru-extras">
.streak{display:flex;align-items:center;gap:4px;height:34px;padding:0 11px;margin-right:2px;border-radius:999px;font-weight:800;font-size:13px;color:#ffc27a;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);flex:none}
.streak svg{width:16px;height:16px;color:#ff9f43;fill:rgba(255,159,67,.3)}
.modebar{align-self:flex-start;margin:0 0 -2px 16px;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:750;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);animation:pop .25s var(--ease)}
.acts{display:flex;gap:2px;margin:8px 0 0 -6px}
.act{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.act svg{width:16px;height:16px}.act:active{background:rgba(255,255,255,.12)}.act.on{color:var(--pink)}
body .sheet{max-height:90dvh;overflow-y:auto}
.sec{font-size:12px;color:var(--muted);font-weight:750;margin:16px 2px 8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb{padding:12px 4px;border-radius:13px;font-size:12px;font-weight:750;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge)}
.mb.on{background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 40%,transparent),color-mix(in srgb,var(--purple) 24%,transparent));border-color:rgba(255,255,255,.3)}
.sw{display:flex;gap:14px;padding:2px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,border-color .2s}
.sw button.on{border-color:#fff;transform:scale(1.08)}
</style>
<style id="niru-v2">
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
/* right-side history drawer */
body .drawer{left:auto;right:0;transform:translateX(102%);border-right:0;border-left:1px solid var(--g-line);box-shadow:inset 1px 0 0 rgba(255,255,255,.14),-20px 0 40px rgba(0,0,0,.35)}
.drawer .logo{font-size:24px;padding:0 8px 8px}
.drawer .rt{border-top:0;margin-top:0}
/* bottom tab bar */
body .compose{margin:8px 10px 6px}
.tabbar{flex:none;position:relative;display:flex;margin:0 10px calc(env(safe-area-inset-bottom) + 8px);padding:4px;border-radius:22px;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:700;color:var(--muted);position:relative;z-index:1;border-radius:18px}
.tb svg{width:20px;height:20px}.tb.on{color:#fff}.tb.on svg{color:var(--pink)}
.tb-glass{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:18px;pointer-events:none;z-index:0;opacity:0;will-change:transform;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--pink) 30%,transparent);transition:transform .42s cubic-bezier(.3,1.25,.5,1
