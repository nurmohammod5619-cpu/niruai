<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#09090d">
<title>Niru AI</title>
<style>
:root{--bg:#08080c;--panel:#111118;--panel2:#171720;--line:#292934;--text:#f7f7fb;--muted:#9b9ba9;--pink:#ff2690;--purple:#9857ff;--good:#46d89a;--danger:#ff5575;--g:linear-gradient(135deg,var(--pink),var(--purple))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050507;color:var(--text);font-family:Inter,"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none}[hidden]{display:none!important}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{position:fixed;inset:0;height:100dvh;width:min(100%,620px);margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:621px){.wrap{border:solid var(--line);border-width:0 1px}}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}.ib:active{background:var(--panel2)}
.logo{font-weight:900;letter-spacing:-.6px}.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark{display:grid;place-items:center;border-radius:50%;background:var(--g);font-weight:900;flex:none}
/* login */
#login{padding:calc(env(safe-area-inset-top) + 24px) 22px 24px;justify-content:center;overflow:auto}
#login .mark{width:72px;height:72px;font-size:32px;margin:0 auto 14px;box-shadow:0 10px 40px rgba(255,38,144,.3)}
#login h1{text-align:center;font-size:30px;margin:0}#login p{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px}
.tab{flex:1;color:#8f8f9d;padding:11px;border-bottom:2px solid transparent;font-size:13px;font-weight:750}.tab.on{color:#fff;border-color:var(--pink)}
.field{margin:10px 0}.field label{font-size:11px;color:#aaaab6;display:block;margin-bottom:6px}
.field input{width:100%;background:#0b0b10;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.field input:focus{border-color:rgba(255,38,144,.55)}
.btn{background:var(--g);padding:13px 14px;border-radius:12px;font-weight:800;font-size:14px;width:100%;margin-top:8px}
.msgerr{color:#ff7f98;font-size:12px;min-height:16px;margin-top:6px}
/* top */
.top{height:60px;flex:none;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 10px 4px;background:rgba(13,13,20,.97);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;text-align:center;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 13px 22px;display:flex;flex-direction:column;gap:10px}
.hello{margin:auto;text-align:center}.hello .mark{width:64px;height:64px;font-size:28px;margin:0 auto 14px}.hello h2{margin:0;font-size:24px}.hello p{color:var(--muted);margin:6px 0 0;font-size:14px}
.bubble{max-width:88%;min-width:0;padding:11px 13px;border-radius:17px;background:#1b1b25;border:1px solid #2c2c38;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:linear-gradient(135deg,#9c2870,#6335a0);border-color:transparent;border-bottom-right-radius:5px;white-space:pre-wrap}
.theirs{align-self:flex-start;border-bottom-left-radius:5px}.bubble:has(.code){width:min(100%,92%)}
.time{font-size:10px;color:#c6c2ce;display:block;text-align:right;margin-top:5px}.theirs .time{color:#777783}
.md p{margin:0 0 8px}.md p:last-child{margin:0}.md h4{margin:10px 0 6px;font-size:15px}.md ul,.md ol{margin:4px 0 8px;padding-left:20px}
.md code{background:#0b0b10;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#ff9ccd}
.code{margin:8px 0;background:#0b0b10;border:1px solid var(--line);border-radius:12px;overflow:hidden}.code:first-child{margin-top:0}
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.copy{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:750;color:#c9c9d4}.copy.done{color:var(--good)}
.code pre{margin:0;padding:12px;overflow-x:auto}.code pre code{display:block;background:none;border:0;padding:0;color:#e6e6ef;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.t-c{color:#6f7a8c;font-style:italic}.t-s{color:#7ee2a8}.t-n{color:#ffb86b}.t-k{color:#ff75b7}.t-f{color:#a98bff}
.typing{display:flex;gap:4px;padding:4px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.typing i{animation:none}}
.err{align-self:center;max-width:90%;text-align:center;font-size:12px;color:#ff7f98;background:rgba(255,85,117,.13);border:1px solid rgba(255,85,117,.3);padding:9px 12px;border-radius:12px}
/* page */
#page{flex:1;overflow-y:auto;padding:16px 14px}#page h2{margin:0 0 12px;font-size:20px}.empty{color:var(--muted);text-align:center;margin-top:60px;font-size:13px;line-height:1.6}
/* compose */
.compose{flex:none;display:flex;align-items:flex-end;gap:6px;margin:8px 10px calc(env(safe-area-inset-bottom) + 10px);padding:6px;background:#1a1a24;border:1px solid #333340;border-radius:26px}
.compose:focus-within{border-color:rgba(255,38,144,.55)}
.compose textarea{flex:1;min-height:42px;max-height:110px;resize:none;background:none;border:0;outline:0;padding:11px 4px;line-height:1.35}
.compose .ib{border-radius:50%;background:var(--panel2);width:42px;height:42px}.compose .on{color:var(--pink)}
#send{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
/* drawer + sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:40;opacity:0;pointer-events:none;transition:.22s}.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(84%,340px);z-index:50;background:#0d0d14;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 12px calc(env(safe-area-inset-bottom) + 14px)}
.drawer.show{transform:none}
.drawer .logo{font-size:26px;padding:0 8px 14px}
.nv{display:flex;align-items:center;gap:14px;padding:13px 10px;border-radius:13px;font-size:15px;font-weight:650;width:100%;text-align:left}.nv.on{background:var(--panel2)}.nv svg{color:var(--pink)}
.rt{font-size:12px;color:var(--muted);padding:14px 10px 6px;border-top:1px solid var(--line);margin-top:8px}
.rec{flex:1;overflow-y:auto}.ri{display:flex;align-items:center;border-radius:12px}.ri.on{background:var(--panel2)}
.ri .o{flex:1;min-width:0;text-align:left;padding:11px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .x{color:#777783;width:34px;height:34px;display:grid;place-items:center}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px}.foot .mark{width:44px;height:44px;font-size:15px}
.nc{background:var(--g);padding:13px 20px;border-radius:999px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet-bg{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:flex-end}.sheet-bg.show{display:flex}
.sheet{width:100%;background:#101017;border:1px solid var(--line);border-radius:23px 23px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sh{display:flex;align-items:center;margin-bottom:12px;font-size:17px;font-weight:850}.sh span{flex:1;text-align:center}.sh .ib{background:var(--panel2)}
.mo{display:flex;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:8px}
.mo.on{border-color:rgba(255,38,144,.55);background:rgba(255,38,144,.08)}.mo div{flex:1}.mo b{display:block;font-size:15px}.mo small{color:var(--muted);font-size:12px}.mo svg{color:var(--pink)}
.eff{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:4px;font-weight:750}
.eff em{font-style:normal;color:var(--muted);font-weight:600;font-size:13px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#24242d;border:1px solid #3b3b47;padding:10px 14px;border-radius:13px;font-size:12px;z-index:90;display:none}
</style>
<style id="niru-liquid-glass">
/* ===== Liquid Glass skin (like NexChat): blur only on small bars/sheets, cheap frosted gradients elsewhere ===== */
html{background:#07070d}
*{-webkit-tap-highlight-color:transparent}
body{background:transparent!important;
  --g-bg:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 50%,rgba(255,255,255,.09));
  --g-line:rgba(255,255,255,.17);--g-blur:blur(16px) saturate(150%);
  --g-edge:inset 0 1px 0 rgba(255,255,255,.32),0 6px 16px rgba(0,0,0,.24);
  --ease:cubic-bezier(.2,.8,.25,1)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--pink) 55%,transparent),transparent 36%),
   radial-gradient(circle at 90% 26%,color-mix(in srgb,var(--purple) 55%,transparent),transparent 38%),
   radial-gradient(circle at 25% 90%,rgba(56,140,255,.34),transparent 40%),
   radial-gradient(circle at 80% 88%,color-mix(in srgb,var(--pink) 34%,transparent),transparent 34%)}
body .wrap{background:transparent}
/* frosted (no blur) */
body :is(.bubble.theirs,.mo,.eff,.copy,.btn.sec,.field input){background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge)}
body .field input{background:rgba(255,255,255,.08);box-shadow:none}
body .code{background:rgba(8,8,14,.55);border-color:var(--g-line)}
body .ch{background:rgba(255,255,255,.07);border-color:var(--g-line)}
body .md code{background:rgba(8,8,14,.5)}
body .mine{background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 72%,transparent),color-mix(in srgb,var(--purple) 72%,transparent));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
body .mo.on{background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 40%,transparent),color-mix(in srgb,var(--purple) 24%,transparent));border-color:rgba(255,255,255,.3)}
body .btn,body .nc,body #send{border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px color-mix(in srgb,var(--pink) 28%,transparent)}
/* real blur: small always-visible bars only */
body :is(.top,.compose,.toast){background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
body .top{border-width:0 0 1px;border-radius:0}
body .compose{margin:8px 10px calc(env(safe-area-inset-bottom) + 10px);border-radius:30px;box-shadow:var(--g-edge),0 14px 30px rgba(0,0,0,.34)}
body .compose .ib{background:rgba(255,255,255,.1)}
body .drawer{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(14,12,26,.86);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);border-right:1px solid var(--g-line);box-shadow:inset -1px 0 0 rgba(255,255,255,.14),20px 0 40px rgba(0,0,0,.35)}
body .sheet{border-radius:28px 28px 0 0;border:1px solid var(--g-line);border-bottom:0;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(18,16,30,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
body .toast{border-radius:999px;padding:11px 18px}
body .rt{border-color:var(--g-line)}
body .ri.on{background:var(--g-bg)}
body .tabs{border-color:var(--g-line)}
body .hello .mark{box-shadow:0 10px 40px color-mix(in srgb,var(--pink) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
/* sliding glass indicator: transform only */
.navs{position:relative}.navs .nv{position:relative;z-index:1}
body .nv.on{background:none}
.nav-glass{position:absolute;left:0;right:0;top:0;height:0;border-radius:13px;pointer-events:none;z-index:0;opacity:0;will-change:transform;
  background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--pink) 30%,transparent);
  transition:transform .42s cubic-bezier(.3,1.25,.5,1),height .2s,opacity .2s}
.nav-glass.on{opacity:1}
/* smooth motion */
.drawer{transition:transform .36s var(--ease);will-change:transform}.scrim{transition:opacity .3s}
button{transition:transform .15s,background .18s,border-color .18s}
:is(.ib,.nc,.mo,.eff,.nv,.chip,.copy,.btn,#send,.ri .o):active{transform:scale(.95)}
.bubble,.err{animation:pop .26s var(--ease) backwards}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.lg-enter{animation:lgPage .3s var(--ease) backwards}
@keyframes lgPage{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.sheet-bg.show{animation:fade .22s ease}.sheet-bg.show .sheet{animation:up .36s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation:pop .22s var(--ease)}
.msgs,#page,.rec{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="niru-glass-2">
/* Login: top-aligned so switching tabs never moves the logo; glass card; sliding tab indicator */
body #login{justify-content:flex-start;padding:calc(env(safe-area-inset-top) + clamp(20px,8vh,72px)) 18px 28px}
.lhead,.gcard{position:relative;z-index:1}
.lhead{margin-bottom:6px}
.orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.o1{width:240px;height:240px;left:-70px;top:30%;background:radial-gradient(circle at 40% 40%,var(--pink),transparent 70%);opacity:.9}
.o2{width:280px;height:280px;right:-90px;bottom:6%;background:radial-gradient(circle at 60% 40%,var(--purple),transparent 70%);opacity:.95}
.gcard{padding:16px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 55%,rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 18px 44px rgba(0,0,0,.38);-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%)}
.gcard .field label{color:#dcdce8}
.gcard .field input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:border-color .2s,background .2s}
.gcard .field input:focus{background:rgba(255,255,255,.15)}
body .tabs{position:relative;display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:4px;margin-bottom:6px}
body .tab,body .tab.on{border:0;border-radius:12px;position:relative;z-index:1;background:none;transition:color .25s}
body .tab.on{color:#fff}
.tab-glass{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;pointer-events:none;z-index:0;will-change:transform;background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--pink) 30%,transparent);transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
.collapse{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .36s var(--ease),opacity .28s}
.collapse.open{grid-template-rows:1fr;opacity:1}.collapse>div{overflow:hidden;min-height:0}
.swap{animation:swap .28s var(--ease)}@keyframes swap{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
/* smooth moves between screens */
.app-in{animation:appIn .5s var(--ease) backwards}
@keyframes appIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.ttl-in{animation:fade .28s ease}
.hello{animation:pop .45s var(--ease) backwards}
.static .bubble{animation:none}
.sheet-bg.out{animation:fadeOut .21s ease forwards}.sheet-bg.out .sheet{animation:down .22s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}}@keyframes down{to{transform:translateY(70px);opacity:.3}}
</style>
<style id="niru-extras">
.streak{display:flex;align-items:center;gap:4px;height:34px;padding:0 11px;margin-right:2px;border-radius:999px;font-weight:800;font-size:13px;color:#ffc27a;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);flex:none}
.streak svg{width:16px;height:16px;color:#ff9f43;fill:rgba(255,159,67,.3)}
.modebar{align-self:flex-start;margin:0 0 -2px 16px;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:750;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);animation:pop .25s var(--ease)}
.acts{display:flex;gap:2px;margin:8px 0 0 -6px}
.act{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.act svg{width:16px;height:16px}.act:active{background:rgba(255,255,255,.12)}.act.on{color:var(--pink)}
body .sheet{max-height:90dvh;overflow-y:auto}
.sec{font-size:12px;color:var(--muted);font-weight:750;margin:16px 2px 8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb{padding:12px 4px;border-radius:13px;font-size:12px;font-weight:750;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge)}
.mb.on{background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 40%,transparent),color-mix(in srgb,var(--purple) 24%,transparent));border-color:rgba(255,255,255,.3)}
.sw{display:flex;gap:14px;padding:2px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,border-color .2s}
.sw button.on{border-color:#fff;transform:scale(1.08)}
</style>
<style id="niru-v2">
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
/* right-side history drawer */
body .drawer{left:auto;right:0;transform:translateX(102%);border-right:0;border-left:1px solid var(--g-line);box-shadow:inset 1px 0 0 rgba(255,255,255,.14),-20px 0 40px rgba(0,0,0,.35)}
.drawer .logo{font-size:24px;padding:0 8px 8px}
.drawer .rt{border-top:0;margin-top:0}
/* bottom tab bar */
body .compose{margin:8px 10px 6px}
.tabbar{flex:none;position:relative;display:flex;margin:0 10px calc(env(safe-area-inset-bottom) + 8px);padding:4px;border-radius:22px;background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:700;color:var(--muted);position:relative;z-index:1;border-radius:18px}
.tb svg{width:20px;height:20px}.tb.on{color:#fff}.tb.on svg{color:var(--pink)}
.tb-glass{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:18px;pointer-events:none;z-index:0;opacity:0;will-change:transform;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--pink) 30%,transparent);transition:transform .42s cubic-bezier(.3,1.25,.5,1),width .2s,opacity .2s}
.tb-glass.on{opacity:1}
:is(.tb,.chip,.pill):active{transform:scale(.95)}
body .toast{bottom:150px}
/* pages */
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:-4px 0 14px}
.card{background:var(--g-bg);border:1px solid var(--g-line);box-shadow:var(--g-edge);border-radius:18px;padding:13px;margin-bottom:10px}

.card input,.card textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--g-line);border-radius:12px;padding:11px;outline:none;margin-bottom:8px;resize:none}
.card input:focus,.card textarea:focus{border-color:rgba(255,255,255,.4)}
.card .btn{margin-top:0}

.clip{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);font-size:14px;line-height:1.5}
.clip.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.page-empty{text-align:center;margin:26px 0 16px}
</style>
</head>
<body>
<div class="wrap" id="login" hidden>
  <i class="orb o1"></i><i class="orb o2"></i>
  <div class="lhead"><div class="mark">N</div><h1 class="logo">Niru <b>AI</b></h1><p>Your own AI companion. Talk in any language.</p></div>
  <div class="gcard">
    <div class="tabs" id="tabs"><span class="tab-glass" id="tg"></span><button class="tab on" data-m="in">Login</button><button class="tab" data-m="up">Sign up</button></div>
    <div class="collapse" id="fn"><div><div class="field"><label>Name</label><input id="name" autocomplete="name"></div></div></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>

  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <button class="ib" id="new" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="ttl" id="ttl">Niru AI</div>
    <button class="streak" id="streak" hidden aria-label="Streak"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg><b id="sn">0</b></button>
    <button class="ib" id="mdl" aria-label="Model and style"><svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
    <button class="ib" id="menu" aria-label="History"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div id="page" hidden></div>
  <button class="modebar" id="modebar" hidden></button>
  <div class="compose" id="compose">
    <button class="ib" id="plus" aria-label="Attach file"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <textarea id="in" rows="1" placeholder="Message Niru AI"></textarea>
    <button class="ib" id="mic" aria-label="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <button id="send" aria-label="Send"></button>
  </div>
  <input type="file" id="file" class="vh" tabindex="-1" aria-hidden="true" accept=".txt,.md,.js,.ts,.jsx,.tsx,.py,.html,.css,.json,.java,.kt,.dart,.php,.c,.cpp,.go,.sql,.csv,text/*">
  <nav class="tabbar" id="tabbar"><span class="tb-glass" id="nglass"></span>
    <button class="tb on" data-v="chat"><svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-6l-4 3v-3H5a2 2 0 01-2-2V7a2 2 0 012-2z"/><path d="M8 10h8M8 13h5"/></svg>Talks</button>
    <button class="tb" data-v="projects"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Spaces</button>
    <button class="tb" data-v="code"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10l3 2-3 2M12 15h5"/></svg>Studio</button>
    <button class="tb" data-v="artifacts"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7zM19 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Creations</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="logo">Niru <b>AI</b></div>
    <div class="rt">History</div>
    <div class="rec" id="rec"></div>
    <div class="foot"><button class="mark" id="me" aria-label="Account"></button><button class="nc" id="nc"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button></div>
  </aside>

  <div class="sheet-bg" id="sheetbg"><div class="sheet">
    <div class="sh"><button class="ib" id="sx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span>Model &amp; style</span><i style="width:40px"></i></div>
    <div id="models"></div>
    <button class="eff" id="eff">Effort <em id="effv"></em></button>
    <div class="sec">Mode</div><div class="mgrid" id="modes"></div>
    <div class="sec">Accent colour</div><div class="sw" id="accents"></div>
    <div class="sec">Voice language</div><div class="mgrid" id="voices"></div>
  </div></div>
  <div class="sheet-bg" id="attbg"><div class="sheet">
    <div class="sh"><button class="ib" id="ax" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span>Add to chat</span><i style="width:40px"></i></div>
    <button class="mo" data-a="file"><div><b>Upload a file</b><small>Code or text, up to 100KB. If nothing opens, use Paste.</small></div><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg></button>
    <button class="mo" data-a="paste"><div><b>Paste copied text</b><small>Drop your clipboard into the message</small></div><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5a3 3 0 016 0M9 12h6M9 16h4"/></svg></button>
    <div class="sec">Quick starts</div>
    <div class="chips"><button class="chip" data-p="Explain this simply:">Explain simply</button><button class="chip" data-p="Summarize this:">Summarize</button><button class="chip" data-p="Translate this to Bangla:">Translate to Bangla</button><button class="chip" data-p="Find the bug in this code:">Find the bug</button></div>
  </div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
// ===== Change this: your Niru server address =====
// POST { messages:[{role,content}], stream:true, model:"niru-plus", effort:"medium" }
// The server maps "model" to a real Claude model. Stream: data: {"text":"..."} ... data: [DONE]
// A plain JSON { "reply": "..." } also works.
const NIRU_API = "http://localhost:3000/chat";
// ==============================================
const $ = id => document.getElementById(id), q = s => document.querySelector(s);
const MODELS = [
  { id:"niru-ultra", n:"Niru Ultra", d:"For your toughest challenges" },
  { id:"niru-pro", n:"Niru Pro", d:"For complex work and everyday tasks" },
  { id:"niru-plus", n:"Niru Plus", d:"Most efficient for simpler tasks" },
  { id:"niru-lite", n:"Niru Lite", d:"Fastest for quick answers" }
];
const EFFORTS = ["low","medium","high"];
const VOICES = [{id:"en-US",n:"English"},{id:"bn-BD",n:"\u09AC\u09BE\u0982\u09B2\u09BE"}];
const MODES = [{id:"chat",n:"Chat"},{id:"study",n:"Study Buddy"},{id:"code",n:"Code Mentor"},{id:"write",n:"Writer"},{id:"translate",n:"Translator"},{id:"friend",n:"Friend"}];
const ACC = { pink:["#ff2690","#9857ff"], ocean:["#2f8cff","#7a5cff"], mint:["#19c997","#2f8cff"], sunset:["#ff7a2f","#ff2690"] };
const ST = { get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } },
             set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let user = ST.get("niru-user", null), chats = ST.get("niru-chats", []), cur = null, view = "chat";
let pref = Object.assign({ model:"niru-plus", effort:"medium", mode:"chat", accent:"pink", voice:"en-US" }, ST.get("niru-pref", {}));
let spaces = ST.get("niru-spaces", []), saved = ST.get("niru-saved", []);
const RAW = new WeakMap();
let busy = false, ctrl = null, mode = "in";

/* ---------- markdown + highlight ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const HASH = /^(python|py|bash|sh|shell|yaml|yml|ruby|rb|r|toml)$/i;
const KW = "abstract|as|async|await|break|case|catch|class|const|continue|def|default|del|do|elif|else|enum|except|export|extends|false|final|finally|for|from|func|function|if|implements|import|in|interface|is|lambda|let|new|nil|none|null|of|pass|print|private|public|raise|return|self|static|struct|super|switch|this|throw|true|try|type|var|void|while|with|yield|None|True|False|echo|fi|then|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|JOIN|ON|AND|OR";
const SRC = String.raw`(\/\*[\s\S]*?\*\/|@C)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|\x60(?:\\.|[^\x60\\])*\x60)|(\b\d+(?:\.\d+)?\b)|(\b(?:@K)\b)|(\b[A-Za-z_$][\w$]*(?=\())`;
function hl(code, lang) {
  const re = new RegExp(SRC.replace("@C", HASH.test(lang) ? String.raw`#[^\n]*` : String.raw`\/\/[^\n]*`).replace("@K", KW), "g");
  let out = "", last = 0;
  code.replace(re, (m, a, b, c, d, e, off) => {
    out += esc(code.slice(last, off)) + '<span class="t-' + (a?"c":b?"s":c?"n":d?"k":"f") + '">' + esc(m) + "</span>";
    last = off + m.length; return m;
  });
  return out + esc(code.slice(last));
}
const inl = s => s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
const codeBox = (l, c) => '<div class="code"><div class="ch"><span>' + esc(l || "code") + '</span><button class="copy" type="button">Copy</button></div><pre><code>' + hl(c, l) + "</code></pre></div>";
function md(src) {
  const bl = [];
  src = src.replace(/```([\w+-]*)[^\S\n]*\n?([\s\S]*?)(```|$)/g, (m, l, c) => { bl.push([l.toLowerCase(), c.replace(/\n$/, "")]); return "\u0000" + (bl.length-1) + "\u0000"; });
  let h = "", ls = null; const cl = () => { if (ls) { h += "</" + ls + ">"; ls = null; } };
  for (const ln of esc(src).split("\n")) { let m;
    if ((m = ln.match(/^\u0000(\d+)\u0000$/))) { cl(); h += codeBox(...bl[+m[1]]); }
    else if ((m = ln.match(/^#{1,4}\s+(.*)/))) { cl(); h += "<h4>" + inl(m[1]) + "</h4>"; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if (ls !== "ul") { cl(); h += "<ul>"; ls = "ul"; } h += "<li>" + inl(m[1]) + "</li>"; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (ls !== "ol") { cl(); h += "<ol>"; ls = "ol"; } h += "<li>" + inl(m[1]) + "</li>"; }
    else if (!ln.trim()) cl(); else { cl(); h += "<p>" + inl(ln) + "</p>"; } }
  cl(); return h;
}

/* ---------- login ---------- */
async function hash(s) {
  if (!(window.crypto && crypto.subtle)) return btoa(unescape(encodeURIComponent(s)));
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  mode = t.dataset.m;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  $("fn").classList.toggle("open", mode === "up"); $("tg").style.transform = mode === "up" ? "translateX(100%)" : "none";
  $("go").textContent = mode === "in" ? "Login" : "Create account"; $("lerr").textContent = ""; $("go").classList.remove("swap"); void $("go").offsetWidth; $("go").classList.add("swap");
});
$("go").onclick = async () => {
  const email = $("email").value.trim().toLowerCase(), pass = $("pass").value, name = $("name").value.trim();
  const fail = m => $("lerr").textContent = m;
  if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Enter a valid email address.");
  if (pass.length < 6) return fail("Password must be at least 6 characters.");
  const users = ST.get("niru-users", {}), ph = await hash(email + ":" + pass);
  if (mode === "up") {
    if (!name) return fail("Enter your name.");
    if (users[email]) return fail("An account with this email already exists. Please log in.");
    users[email] = { name, ph }; ST.set("niru-users", users);
  } else if (!users[email] || users[email].ph !== ph) return fail("Incorrect email or password.");
  user = { email, name: users[email].name }; ST.set("niru-user", user); start();
};

/* ---------- app ---------- */
const msgsEl = $("msgs"), input = $("in"), sendBtn = $("send");
const ICON_SEND = '<svg viewBox="0 0 24 24"><path d="M5 12l14-7-5 14-2-6-7-1z"/></svg>', ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>';
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
const toast = t => { const e = $("toast"); e.textContent = t; e.style.display = "block"; setTimeout(() => e.style.display = "none", 2200); };
const saveChats = () => ST.set("niru-chats", chats.slice(0, 50));
const toBottom = () => msgsEl.scrollTop = msgsEl.scrollHeight;
const nearBottom = () => msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 90;

function start() {
  $("login").hidden = true; $("app").hidden = false;
  $("app").classList.remove("app-in"); void $("app").offsetWidth; $("app").classList.add("app-in");
  $("me").textContent = initials(user.name);
  applyAccent(); showStreak(); newChat(); renderModels();
}
function newChat() {
  if (ctrl) ctrl.abort();
  cur = { id: Date.now(), title: "New chat", messages: [] };
  show("chat"); renderChat(); renderDrawer(); closeDrawer();
}
function renderChat() {
  msgsEl.innerHTML = ""; setTitle(cur.messages.length ? cur.title : (cur.space ? cur.space.name : "Niru AI")); msgsEl.classList.add("static");
  if (!cur.messages.length) {
    msgsEl.innerHTML = '<div class="hello"><div class="mark">N</div><h2>Hi, ' + esc(user.name.split(" ")[0]) + '</h2><p>' + (cur.space ? 'Space \u00B7 ' + esc(cur.space.name) : 'What can I help you with today?') + '</p></div>';
  } else cur.messages.forEach((m, i) => { const x = bubble(m.role, m.content); if (m.role === "assistant") addActions(x.d, m.content, i === cur.messages.length - 1); });
  setBusy(false); toBottom();
  requestAnimationFrame(() => requestAnimationFrame(() => msgsEl.classList.remove("static")));
}
function bubble(role, text) {
  const d = document.createElement("div"), b = document.createElement("div"), t = document.createElement("span");
  d.className = "bubble " + (role === "user" ? "mine" : "theirs"); b.className = role === "user" ? "" : "md";
  if (role === "user") b.textContent = text; else b.innerHTML = md(text);
  t.className = "time"; t.textContent = new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  d.append(b, t); msgsEl.appendChild(d); return { d, b };
}
function setBusy(on) { busy = on; sendBtn.innerHTML = on ? ICON_STOP : ICON_SEND; }

/* ---- Niru extras: streak, modes, accents, reply actions ---- */
const ldate = t => { const x = new Date(t); return x.getFullYear() + "-" + (x.getMonth() + 1) + "-" + x.getDate(); };
function streakNow() { const s = ST.get("niru-streak", { d:"", n:0 }); return (s.d === ldate(Date.now()) || s.d === ldate(Date.now() - 864e5)) ? s.n : 0; }
function showStreak() { const n = streakNow(); $("streak").hidden = !n; $("sn").textContent = n; }
function bumpStreak() {
  const s = ST.get("niru-streak", { d:"", n:0 }), today = ldate(Date.now()); if (s.d === today) return;
  const n = s.d === ldate(Date.now() - 864e5) ? s.n + 1 : 1; ST.set("niru-streak", { d:today, n });
  showStreak(); toast(n === 1 ? "Streak started! Chat daily to keep it." : n + "-day streak!");
}
function applyAccent() { const c = ACC[pref.accent] || ACC.pink, r = document.documentElement.style; r.setProperty("--pink", c[0]); r.setProperty("--purple", c[1]); }
function renderStyle() {
  $("modes").innerHTML = MODES.map(m => '<button class="mb' + (m.id === pref.mode ? " on" : "") + '" data-id="' + m.id + '">' + m.n + "</button>").join("");
  $("accents").innerHTML = Object.keys(ACC).map(k => '<button class="' + (k === pref.accent ? "on" : "") + '" data-k="' + k + '" aria-label="' + k + '" style="background:linear-gradient(135deg,' + ACC[k][0] + "," + ACC[k][1] + ')"></button>').join("");
  $("voices").innerHTML = VOICES.map(v => '<button class="mb' + (v.id === pref.voice ? " on" : "") + '" data-id="' + v.id + '">' + v.n + "</button>").join("");
  const m = MODES.find(x => x.id === pref.mode) || MODES[0], bar = $("modebar");
  bar.hidden = pref.mode === "chat"; bar.textContent = m.n + " mode \u00B7 tap to reset";
}
const IC = { copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>', speak:'<path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 010 6"/>', regen:'<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>', share:'<path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/>', save:'<path d="M6 4h12v17l-6-4-6 4z"/>' };
function addActions(d, text, last) {
  RAW.set(d, text);
  if (last) msgsEl.querySelectorAll(".theirs .rg").forEach(x => { if (x.closest(".bubble") !== d) x.remove(); });
  if (d.querySelector(".acts")) return;
  const r = document.createElement("div"); r.className = "acts";
  const b = (a, t, c) => '<button class="act ' + (c || "") + '" data-a="' + a + '" aria-label="' + t + '" title="' + t + '"><svg viewBox="0 0 24 24">' + IC[a] + "</svg></button>";
  r.innerHTML = b("copy", "Copy") + b("speak", "Read aloud") + b("save", "Save to Creations") + (last ? b("regen", "Regenerate", "rg") : "") + b("share", "Share");
  d.insertBefore(r, d.querySelector(".time"));
}
function speak(t, b) {
  if (!window.speechSynthesis) return toast("Read aloud isn't supported here");
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g, " code block. ").replace(/[*#`_]/g, ""));
  u.lang = /[\u0980-\u09FF]/.test(t) ? "bn-BD" : (navigator.language || "en-US");
  u.onend = u.onerror = () => b.classList.remove("on"); b.classList.add("on"); speechSynthesis.speak(u);
}
function regen() {
  const ms = cur.messages; if (busy || ms.length < 2 || ms[ms.length - 1].role !== "assistant") return;
  const u = ms[ms.length - 2].content; ms.splice(-2);
  const bs = msgsEl.querySelectorAll(".bubble"); bs[bs.length - 1].remove(); bs[bs.length - 2].remove();
  input.value = u; send();
}
function setTitle(t) { const e = $("ttl"); if (e.textContent === t) return; e.textContent = t; e.classList.remove("ttl-in"); void e.offsetWidth; e.classList.add("ttl-in"); }
function closeSheet(id) { const b = $(id || "sheetbg"); if (!b.classList.contains("show") || b.classList.contains("out")) return; b.classList.add("out"); setTimeout(() => b.classList.remove("show", "out"), 210); }
function moveGlass() {
  const a = document.querySelector(".tb.on"), g = $("nglass"); if (!a || !g || !a.offsetWidth) return;
  g.style.width = a.offsetWidth + "px"; g.style.transform = "translateX(" + a.offsetLeft + "px)"; g.classList.add("on");
}
function enter(el) { el.classList.remove("lg-enter"); void el.offsetWidth; el.classList.add("lg-enter"); }
const TITLES = { projects:"Spaces", code:"Studio", artifacts:"Creations" };
function show(v) {
  view = v;
  $("msgs").hidden = v !== "chat"; $("page").hidden = v === "chat";
  document.querySelectorAll(".tb").forEach(n => n.classList.toggle("on", n.dataset.v === v));
  moveGlass(); enter(v === "chat" ? $("msgs") : $("page"));
  if (v === "chat") return;
  setTitle(TITLES[v]); renderPage(v);
}
const STARTERS = '<div class="chips"><button class="chip" data-p="Write a Python script that">Python script</button><button class="chip" data-p="Build a single-file HTML page for">HTML page</button><button class="chip" data-p="Explain this code line by line:">Explain code</button><button class="chip" data-p="Find and fix the bug in this code:">Fix a bug</button></div>';
function renderPage(v) {
  const p = $("page");
  if (v === "projects") {
    p.innerHTML = '<h2>Spaces</h2><p class="sub">A space is a topic or persona with its own instructions. Start any chat inside it.</p>' +
      '<form class="card" id="spf"><input id="spn" maxlength="40" placeholder="Space name, e.g. Physics prep" autocomplete="off"><textarea id="spi" rows="2" maxlength="400" placeholder="How should Niru behave here? (optional)"></textarea><button class="btn" type="submit">Create space</button></form>' +
      (spaces.length ? spaces.map(x => '<div class="card" data-id="' + x.id + '"><b>' + esc(x.name) + "</b>" + (x.note ? "<p>" + esc(x.note) + "</p>" : "") + '<div class="row"><button class="pill go" data-a="chat">Chat</button><button class="pill" data-a="del">Delete</button></div></div>').join("") : '<div class="empty" style="margin-top:20px">No spaces yet. Create your first one above.</div>');
  } else if (v === "code") {
    let h = "", n = 0;
    chats.forEach(c => c.messages.forEach(m => { if (m.role === "assistant") m.content.replace(/```([\w+-]*)[^\S\n]*\n?([\s\S]*?)```/g, (x, l, c2) => { h += codeBox(l.toLowerCase(), c2.replace(/\n$/, "")); n++; return x; }); }));
    p.innerHTML = "<h2>Studio</h2>" + (n ? '<p class="sub">Every code block Niru has written for you.</p>' + h : '<p class="sub">Code Niru writes shows up here, ready to copy. Start something:</p>' + STARTERS);
  } else {
    p.innerHTML = "<h2>Creations</h2>" + (saved.length ? '<p class="sub">Replies you saved with the bookmark button.</p>' + saved.map(x => '<div class="card" data-id="' + x.id + '"><div class="clip md">' + md(x.text) + '</div><div class="row"><button class="pill" data-a="open">Expand</button><button class="pill" data-a="copy">Copy</button><button class="pill" data-a="del">Delete</button></div></div>').join("")
      : '<div class="empty">Nothing saved yet. Tap the bookmark under any Niru reply to keep it here.</div>');
  }
}
function toChat() { if (view !== "chat") { show("chat"); renderChat(); } }
function quick(t) { toChat(); input.value = t + " " + input.value; input.oninput(); input.focus(); }
async function pasteClip() {
  toChat();
  try { const t = await navigator.clipboard.readText(); if (!t) return toast("Clipboard is empty"); input.value += (input.value ? "\n" : "") + t; input.oninput(); input.focus(); }
  catch (e) { input.focus(); toast("Clipboard is blocked here. Long-press the message box and tap Paste."); }
}
function renderDrawer() {
  const r = $("rec"); r.innerHTML = "";
  if (!chats.length) { r.innerHTML = '<div class="empty" style="margin-top:20px">No chats yet</div>'; return; }
  chats.forEach(c => {
    const row = document.createElement("div"), o = document.createElement("button"), x = document.createElement("button");
    row.className = "ri" + (cur && c.id === cur.id ? " on" : ""); o.className = "o"; o.textContent = c.title;
    x.className = "x"; x.setAttribute("aria-label", "Delete"); x.innerHTML = '<svg viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M4 7h16M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>';
    o.onclick = () => { if (ctrl) ctrl.abort(); cur = c; show("chat"); renderChat(); renderDrawer(); closeDrawer(); };
    x.onclick = () => { chats = chats.filter(k => k.id !== c.id); saveChats(); if (cur && cur.id === c.id) newChat(); else renderDrawer(); };
    row.append(o, x); r.appendChild(row);
  });
}
const openDrawer = () => { moveGlass(); $("drawer").classList.add("show"); $("scrim").classList.add("show"); };
const closeDrawer = () => { $("drawer").classList.remove("show"); $("scrim").classList.remove("show"); };

/* ---------- send / stream ---------- */
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  bumpStreak();
  if (view !== "chat") show("chat"), renderChat();
  input.value = ""; input.style.height = "auto";
  if (!cur.messages.length) { cur.title = text.slice(0, 40); if (!chats.includes(cur)) chats.unshift(cur); }
  setTitle(cur.title);
  if (msgsEl.querySelector(".hello")) msgsEl.innerHTML = "";
  bubble("user", text); cur.messages.push({ role:"user", content:text }); saveChats(); renderDrawer(); toBottom();
  const ai = bubble("assistant", ""); ai.b.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>'; toBottom();
  setBusy(true); ctrl = new AbortController();
  let full = "", raf = 0;
  const paint = () => { raf = 0; const nb = nearBottom(); ai.b.innerHTML = md(full); if (nb) toBottom(); };
  const fail = m => { ai.d.remove(); cur.messages.pop(); saveChats(); if (m) { const e = document.createElement("div"); e.className = "err"; e.textContent = m; msgsEl.appendChild(e); toBottom(); } };
  try {
    const res = await fetch(NIRU_API, { method:"POST", headers:{ "Content-Type":"application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ messages: cur.messages.slice(-20), stream:true, model: pref.model, effort: pref.effort, mode: pref.mode, user: user.name, space: cur.space || null }) });
    if (!res.ok) throw new Error("Server " + res.status);
    if ((res.headers.get("content-type") || "").includes("text/event-stream")) {
      const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
      outer: while (true) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream:true }); const ls = buf.split("\n"); buf = ls.pop();
        for (const ln of ls) { if (!ln.startsWith("data:")) continue; const p = ln.slice(5).trim(); if (p === "[DONE]") break outer;
          try { full += JSON.parse(p).text || ""; } catch (e) { full += p; } if (!raf) raf = setTimeout(paint, 70); }
      }
    } else full = (await res.json()).reply || "";
    if (raf) clearTimeout(raf); paint();
    if (full) { cur.messages.push({ role:"assistant", content:full }); saveChats(); addActions(ai.d, full, true); } else fail("Niru didn't reply. Please try again.");
  } catch (e) {
    if (raf) clearTimeout(raf);
    if (e.name === "AbortError" && full) { paint(); cur.messages.push({ role:"assistant", content:full }); saveChats(); addActions(ai.d, full, true); }
    else fail(e.name === "AbortError" ? "" : "Can't reach the Niru server. Check the NIRU_API address and that the server is running.");
  } finally { setBusy(false); ctrl = null; }
}

/* ---------- model sheet ---------- */
function renderModels() {
  renderStyle();
  $("models").innerHTML = MODELS.map(m => '<button class="mo' + (m.id === pref.model ? " on" : "") + '" data-id="' + m.id + '"><div><b>' + m.n + "</b><small>" + m.d + "</small></div>" +
    (m.id === pref.model ? '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>' : "") + "</button>").join("");
  $("effv").textContent = pref.effort[0].toUpperCase() + pref.effort.slice(1) + (pref.effort === "medium" ? " (Recommended)" : "");
}
$("models").onclick = e => { const b = e.target.closest(".mo"); if (!b) return; pref.model = b.dataset.id; ST.set("niru-pref", pref); renderModels(); closeSheet(); toast(MODELS.find(m => m.id === pref.model).n + " selected"); };
$("eff").onclick = () => { pref.effort = EFFORTS[(EFFORTS.indexOf(pref.effort) + 1) % 3]; ST.set("niru-pref", pref); renderModels(); };
$("mdl").onclick = () => $("sheetbg").classList.add("show");
$("sx").onclick = () => closeSheet();
$("sheetbg").onclick = e => { if (e.target.id === "sheetbg") closeSheet(); };

/* ---------- events ---------- */
$("menu").onclick = openDrawer; $("scrim").onclick = closeDrawer;
$("new").onclick = newChat; $("nc").onclick = newChat;
document.querySelectorAll(".tb").forEach(n => n.onclick = () => { if (n.dataset.v === "chat") toChat(); else show(n.dataset.v); closeDrawer(); });
addEventListener("resize", moveGlass);
$("me").onclick = () => { if (confirm(user.name + " (" + user.email + ")\n\nLog out?")) { ST.set("niru-user", null); location.reload(); } };
sendBtn.onclick = () => busy ? ctrl && ctrl.abort() : send();
input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); } };
input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 110) + "px"; };
$("plus").onclick = () => $("attbg").classList.add("show");
$("ax").onclick = () => closeSheet("attbg");
$("attbg").onclick = e => {
  if (e.target.id === "attbg") return closeSheet("attbg");
  const b = e.target.closest("[data-a],[data-p]"); if (!b) return;
  if (b.dataset.p) { closeSheet("attbg"); quick(b.dataset.p); }
  else if (b.dataset.a === "file") { try { $("file").click(); } catch (err) { toast("File picker isn't available here. Try Paste instead."); } closeSheet("attbg"); }
  else if (b.dataset.a === "paste") { closeSheet("attbg"); pasteClip(); }
};
$("file").onchange = e => { const f = e.target.files[0]; if (!f) return; if (f.size > 100000) { e.target.value = ""; return toast("File too large (max 100KB)"); }
  toChat(); f.text().then(t => { input.value += (input.value ? "\n" : "") + "```" + (f.name.split(".").pop()) + "\n" + t + "\n```\n"; input.oninput(); input.focus(); toast(f.name + " added"); }).catch(() => toast("Couldn't read that file")); e.target.value = ""; };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("mic").onclick = () => {
  if (rec) { try { rec.stop(); } catch (e) {} return; }
  const noVoice = () => { input.focus(); toast("Voice input isn't available here. Use the mic key on your keyboard."); };
  if (!SR) return noVoice();
  let r; try { r = new SR(); } catch (e) { return noVoice(); }
  toChat();
  r.lang = pref.voice || "en-US"; r.interimResults = true; r.continuous = false;
  const base = input.value;
  r.onresult = e => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; input.value = (base ? base + " " : "") + t; input.oninput(); };
  r.onend = () => { rec = null; $("mic").classList.remove("on"); };
  r.onerror = e => { const er = e.error;
    if (er === "not-allowed" || er === "service-not-allowed") { toast("Mic is blocked. Allow it in browser settings, or use your keyboard's mic key."); input.focus(); }
    else if (er === "no-speech") toast("Didn't hear anything. Try again."); else if (er !== "aborted") toast("Voice input failed (" + er + ")."); };
  try { r.start(); rec = r; $("mic").classList.add("on"); } catch (e) { rec = null; toast("Couldn't start the mic."); }
};
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const code = b.closest(".code").querySelector("pre").textContent;
  try { await navigator.clipboard.writeText(code); } catch (_) { const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  b.textContent = "Copied"; b.classList.add("done"); setTimeout(() => { b.textContent = "Copy"; b.classList.remove("done"); }, 1500);
});

$("modes").onclick = e => { const b = e.target.closest(".mb"); if (!b) return; pref.mode = b.dataset.id; ST.set("niru-pref", pref); renderModels(); };
$("accents").onclick = e => { const b = e.target.closest("button"); if (!b) return; pref.accent = b.dataset.k; ST.set("niru-pref", pref); applyAccent(); renderModels(); };
$("voices").onclick = e => { const b = e.target.closest(".mb"); if (!b) return; pref.voice = b.dataset.id; ST.set("niru-pref", pref); renderModels(); };
$("page").addEventListener("submit", e => {
  if (e.target.id !== "spf") return; e.preventDefault();
  const n = $("spn").value.trim(); if (!n) return toast("Give your space a name");
  spaces.unshift({ id: Date.now(), name: n, note: $("spi").value.trim() }); ST.set("niru-spaces", spaces); renderPage("projects"); toast("Space created");
});
$("page").addEventListener("click", e => {
  const c = e.target.closest("[data-p]"); if (c) return quick(c.dataset.p);
  const b = e.target.closest("[data-a]"); if (!b) return;
  const card = b.closest(".card"), id = card && +card.dataset.id, a = b.dataset.a;
  if (view === "projects") {
    if (a === "chat") { const x = spaces.find(k => k.id === id); if (x) { newChat(); cur.space = { name: x.name, note: x.note }; renderChat(); input.focus(); } }
    else if (a === "del") { spaces = spaces.filter(k => k.id !== id); ST.set("niru-spaces", spaces); renderPage("projects"); }
  } else if (view === "artifacts") {
    const x = saved.find(k => k.id === id);
    if (a === "open") { const cl = card.querySelector(".clip"); cl.classList.toggle("open"); b.textContent = cl.classList.contains("open") ? "Collapse" : "Expand"; }
    else if (a === "copy" && x) navigator.clipboard.writeText(x.text).then(() => toast("Copied")).catch(() => toast("Couldn't copy"));
    else if (a === "del") { saved = saved.filter(k => k.id !== id); ST.set("niru-saved", saved); renderPage("artifacts"); }
  }
});
$("modebar").onclick = () => { pref.mode = "chat"; ST.set("niru-pref", pref); renderModels(); };
$("streak").onclick = () => toast(streakNow() + "-day streak. Chat daily to keep it!");
msgsEl.addEventListener("click", e => {
  const b = e.target.closest(".act"); if (!b) return;
  const d = b.closest(".bubble"), text = RAW.get(d) || "", a = b.dataset.a;
  if (a === "copy") navigator.clipboard.writeText(text).then(() => toast("Copied")).catch(() => toast("Couldn't copy"));
  else if (a === "speak") speak(text, b);
  else if (a === "share") navigator.share ? navigator.share({ title:"Niru AI", text }).catch(() => {}) : navigator.clipboard.writeText(text).then(() => toast("Copied. Paste it in NexChat"));
  else if (a === "regen") regen();
  else if (a === "save") { if (!saved.some(k => k.text === text)) { saved.unshift({ id: Date.now(), text }); ST.set("niru-saved", saved.slice(0, 100)); } b.classList.add("on"); toast("Saved to Creations"); }
});
applyAccent();
// Fresh install: login first, then a new chat
if (user) start(); else $("login").hidden = false;
</script>
</body>
